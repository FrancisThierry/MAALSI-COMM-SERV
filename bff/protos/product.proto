syntax = "proto3";

package product;

service ProductService {
    rpc GetProductByCategory (ProductRequest) returns (ProductResponseList);
}

message ProductRequest {
    string category = 1;
}

message ProductItem {
    int32 id = 1;
    string name = 2;
    double price = 3;
    string category = 4;
}

message ProductResponseList {
    repeated ProductItem products = 1;
}